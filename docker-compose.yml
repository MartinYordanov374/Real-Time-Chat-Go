services:
    mongo:
        image: mongo:latest
        container_name: mongo
        ports:
            - "27017:27017"
    backend:
        build:
            context: .
            dockerfile: ./Backend/Dockerfile
        ports:
            - "8080:8080"
        depends_on:
            - "mongo"
    redis:
        image: redis:latest
        container_name: redis
        ports:
            - "6379:6379"
